name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: liketrek/TREK
  UPSTREAM_BRANCH: main
  DOWNSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream and fork
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --prune origin "${DOWNSTREAM_BRANCH}"
          git fetch --prune upstream "${UPSTREAM_BRANCH}"

      - name: Merge and push upstream
        run: |
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "origin/${DOWNSTREAM_BRANCH}"; then
            echo 'Fork already contains the current upstream head.'
            exit 0
          fi

          git checkout -B "${DOWNSTREAM_BRANCH}" "origin/${DOWNSTREAM_BRANCH}"
          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            git status --short
            git merge --abort
            exit 1
          fi
          git push origin "${DOWNSTREAM_BRANCH}"

      - name: Report merge conflicts
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream sync requires manual conflict resolution';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Automatic merge from \`${process.env.UPSTREAM_REPO}:${process.env.UPSTREAM_BRANCH}\` failed. Resolve it manually, then close this issue.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
